[project]
name = "py-git-client"
version = "0.0.3"
description = "Run git from Python with as few processes as possible: one way to start git, a long-lived cat-file, and batched reads and writes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Harper", email = "benekastah@gmail.com" }]
requires-python = ">=3.15"
dependencies = []

[project.optional-dependencies]
pygit2 = [
    "pygit2>=1.21.0,<2",
]

[dependency-groups]
# The template's dev tools, kept current by `copier update`; the project's own go in `dev`
# (`uv add --dev`), so the two never conflict.
template-dev = [
    "basedpyright>=1.40.2",
    "coverage>=7.17.3",
    # pandoc, for dev.py man. Pinned: `man --check` compares its exact output with the pages.
    # It has no wheel for Windows on ARM, so dev.py venv fails there.
    "pypandoc_binary==1.17",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]
dev = [
    { include-group = "template-dev" },
    "pygit2>=1.21.0,<2",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_client"]

[tool.pytest]
testpaths = ["tests"]
# One worker per CPU (pytest-xdist); `-n 0` runs them one at a time, e.g. to debug. -rs says
# why each skipped test was skipped (e.g. no German translation of git on this machine).
addopts = ["--numprocesses", "auto", "-p", "git_client.testing", "-rs"]

[tool.ruff]
line-length = 100
target-version = "py315"
# dev.py runs under an older Python too, to say it's too old: keep it to syntax that parses there.
per-file-target-version = { "dev.py" = "py311" }

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    # The project's own below:
]

[tool.basedpyright]
include = [
    "src",
    "tests",
    "dev.py",
    # The project's own below:
    "dev_project.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.15"

[tool.coverage.run]
source = ["git_client"]
branch = true
# Measure each pytest-xdist worker, a process of its own, in a data file of its own, which
# `dev.py coverage` combines.
parallel = true
patch = ["subprocess"]
# pytest-xdist's main process runs no tests, so it measures nothing: not worth a warning.
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
show_missing = true
skip_covered = true
