[project]
name = "py-git-client"
version = "0.1.0"
description = "Run git from Python with as few processes as possible: one way to start git, a long-lived cat-file, and batched reads and writes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Harper", email = "benekastah@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["basedpyright>=1.40.2", "coverage>=7.17.3", "pytest>=9.2.0", "pytest-xdist>=3.8.0", "ruff>=0.17.5"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_client"]

[tool.pytest]
testpaths = ["tests"]
# One worker per CPU (pytest-xdist); `-n 0` runs them one at a time, e.g. to debug. -rs says
# why each skipped test was skipped (e.g. no German translation of git on this machine).
addopts = ["--numprocesses", "auto", "-p", "git_client.testing", "-rs"]

[tool.ruff]
line-length = 100
target-version = "py311"
# dev.py runs under an older Python too, to say it's too old: keep it to syntax that parses there.
per-file-target-version = { "dev.py" = "py311" }

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "SIM"]

[tool.basedpyright]
include = ["src", "tests", "dev.py"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.coverage.run]
source = ["git_client"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
